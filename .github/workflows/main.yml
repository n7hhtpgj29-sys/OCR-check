
name: Build Customs OCR Windows 10 Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install pyinstaller

      - name: Build Windows Portable EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name CustomsOCR --collect-all streamlit --copy-metadata streamlit --collect-all fitz --collect-all openpyxl --collect-all pandas --collect-all pytesseract launcher.py

      - name: Copy application files
        shell: pwsh
        run: |
          Copy-Item app.py dist/CustomsOCR/
          Copy-Item Customs_Import_OCR_Template.xlsx dist/CustomsOCR/
          Copy-Item sample.pdf dist/CustomsOCR/

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/CustomsOCR/CustomsOCR.exe")) {
            throw "CustomsOCR.exe not found"
          }
          if (!(Test-Path "dist/CustomsOCR/app.py")) {
            throw "app.py not found"
          }
          Write-Host "Build files verified"

      - name: Upload Portable Application
        uses: actions/upload-artifact@v4
        with:
          name: CustomsOCR_Win10_Portable
          path: dist/CustomsOCR/
          retention-days: 30
